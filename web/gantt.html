<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>项目甘特图</title>
  <link rel="stylesheet" href="css/app.css?v=1.2.32" />
</head>
<body>
  <header class="app-header no-print">
    <a class="back-link" id="backLink" href="index.html">‹ 返回</a>
    <h1 id="pageTitle">项目甘特图</h1>
    <label class="gantt-toggle no-print">
      <input type="checkbox" id="chkShowActual" checked />
      显示实际进度
    </label>
    <button type="button" class="btn btn-primary no-print" id="btnPrintGantt">打印 / 导出 PDF</button>
    <button type="button" class="btn no-print" id="btnRefresh">刷新</button>
  </header>

  <main class="app-main gantt-main">
    <p class="hint-bar" id="summaryBar">加载中…</p>
    <div class="gantt-legend no-print">
      <span class="gantt-legend-item"><i class="gantt-swatch gantt-swatch-plan"></i>计划</span>
      <span class="gantt-legend-item"><i class="gantt-swatch gantt-swatch-actual"></i>实际</span>
      <span class="gantt-legend-item muted">无计划日期的任务不画条，仅列在左侧</span>
    </div>
    <div id="ganttRoot" class="gantt-root"></div>
  </main>

  <script src="js/config.js?v=1.2.32"></script>
  <script src="js/status.js?v=1.2.32"></script>
  <script src="js/utils.js?v=1.2.32"></script>
  <script src="js/api.js?v=1.2.32"></script>
  <script src="js/gantt.js?v=1.2.32"></script>
</body>
</html>
