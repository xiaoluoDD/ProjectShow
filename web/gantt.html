<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>项目甘特图</title>
  <link rel="stylesheet" href="css/app.css?v=1.2.28" />
</head>
<body>
  <header class="app-header no-print">
    <a class="back-link" id="backLink" href="index.html">‹ 返回</a>
    <h1 id="pageTitle">项目甘特图</h1>
    <button type="button" class="btn btn-primary no-print" id="btnExportExcel">导出 Excel</button>
    <button type="button" class="btn no-print" id="btnPrintGantt">打印 / 导出 PDF</button>
    <button type="button" class="btn no-print" id="btnRefresh">刷新</button>
  </header>

  <main class="app-main gantt-main">
    <p class="hint-bar" id="summaryBar">加载中…</p>
    <div class="gantt-legend no-print">
      <span class="gantt-legend-item"><i class="gantt-swatch gantt-swatch-group"></i>部门标题</span>
      <span class="gantt-legend-item"><i class="gantt-swatch gantt-swatch-plan"></i>计划</span>
      <span class="gantt-legend-item muted">部门作分组标题 · 进度可在本页填写 · 导出 Excel 与本页同结构</span>
    </div>
    <div id="ganttRoot" class="gantt-root"></div>
  </main>

  <script src="js/config.js?v=1.2.28"></script>
  <script src="js/status.js?v=1.2.28"></script>
  <script src="js/utils.js?v=1.2.28"></script>
  <script src="js/api.js?v=1.2.28"></script>
  <script src="js/gantt.js?v=1.2.28"></script>
</body>
</html>
