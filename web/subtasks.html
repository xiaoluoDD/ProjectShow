<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>子任务</title>
  <link rel="stylesheet" href="css/app.css?v=1.2.32" />
</head>
<body>
  <header class="app-header">
    <a class="back-link" id="backLink" href="index.html">‹ 返回</a>
    <h1 id="pageTitle">子任务</h1>
    <button type="button" class="btn btn-primary" id="btnAddSubtask" hidden>新增子任务</button>
    <button type="button" class="btn batch-only-desktop" id="btnBatchAddSubtask" hidden>批量新增</button>
    <button type="button" class="btn btn-primary" id="btnRefresh">刷新</button>
  </header>

  <main class="app-main">
    <p class="hint-bar" id="summaryBar">加载中…</p>
    <div id="subtaskRoot"></div>
  </main>

  <div class="modal-mask" id="completeModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
      <h2 id="completeTitle">标记子任务完结</h2>
      <p class="modal-hint" id="completeHint">填写实际完成日期后，该子任务将视为已完结。</p>
      <p class="card-row" id="completeTaskName"></p>
      <label for="completeDate">实际完成日期</label>
      <input id="completeDate" type="date" />
      <p class="modal-error" id="completeError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnCompleteCancel">取消</button>
        <button type="button" class="btn" id="btnCompleteClear" hidden>清空完成日期</button>
        <button type="button" class="btn btn-primary" id="btnCompleteSave">确认</button>
      </div>
    </div>
  </div>

  <!-- 新增子任务（字段对齐 Qt 桌面 SubTaskEditDialog） -->
  <div class="modal-mask" id="subtaskModal" hidden>
    <div class="modal-card modal-card-form" role="dialog" aria-modal="true" aria-labelledby="subtaskModalTitle">
      <h2 id="subtaskModalTitle">新增子任务</h2>
      <div class="modal-scroll">
        <label for="subtaskContent">任务内容</label>
        <input id="subtaskContent" type="text" autocomplete="off" placeholder="请输入任务内容" />

        <label>负责人</label>
        <p class="modal-hint" id="subtaskOwnerLabel">（加载中…）</p>

        <label for="subtaskMemberDept">筛选部门</label>
        <select id="subtaskMemberDept"></select>

        <label>子项目成员</label>
        <div class="member-checklist" id="subtaskMemberList" aria-live="polite"></div>
        <p class="modal-hint" id="subtaskSelectedCount">已选成员：0 人</p>
        <p class="modal-hint" id="subtaskSelectedSummary">（暂无）</p>

        <label for="subtaskStatus">任务状态</label>
        <select id="subtaskStatus">
          <option value="待启动">待启动</option>
          <option value="进行中">进行中</option>
          <option value="已完结">已完结</option>
          <option value="逾期">逾期</option>
          <option value="暂停">暂停</option>
        </select>
        <p class="modal-hint">保存后状态以后端日期规则为准（与桌面端一致）。</p>

        <label for="subtaskPlannedStart">计划开始日期</label>
        <input id="subtaskPlannedStart" type="date" />

        <label for="subtaskActualStart">实际开始日期</label>
        <input id="subtaskActualStart" type="date" />

        <label for="subtaskPlannedEnd">计划完成日期</label>
        <input id="subtaskPlannedEnd" type="date" />

        <label for="subtaskActualEnd">实际完成日期</label>
        <input id="subtaskActualEnd" type="date" />

        <label for="subtaskRemark">备注</label>
        <textarea id="subtaskRemark" rows="3" placeholder="可选"></textarea>

        <p class="modal-hint">负责人固定为所属项目负责人；子项目成员按部门筛选勾选，可不在项目成员范围内。</p>
      </div>
      <p class="modal-error" id="subtaskFormError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnSubtaskCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnSubtaskSave">创建</button>
      </div>
    </div>
  </div>

  <!-- 批量新增子任务（电脑端 Excel 式表格） -->
  <div class="modal-mask" id="subtaskBatchModal" hidden>
    <div class="modal-card modal-card-batch" role="dialog" aria-modal="true" aria-labelledby="subtaskBatchTitle">
      <h2 id="subtaskBatchTitle">批量新增子任务</h2>
      <p class="modal-hint" id="subtaskBatchOwnerHint">负责人固定为项目负责人</p>
      <div class="batch-table-wrap">
        <table class="batch-table" id="subtaskBatchTable">
          <thead>
            <tr>
              <th class="col-idx">#</th>
              <th class="col-content">任务内容</th>
              <th class="col-member">成员</th>
              <th class="col-date">计划开始</th>
              <th class="col-date">计划完成</th>
              <th class="col-date">实际开始</th>
              <th class="col-date">实际完成</th>
              <th class="col-remark">备注</th>
              <th class="col-act"></th>
            </tr>
          </thead>
          <tbody id="subtaskBatchBody"></tbody>
        </table>
      </div>
      <div class="batch-toolbar">
        <button type="button" class="btn btn-sm" id="btnBatchAddRow">再加一行</button>
        <span class="modal-hint" id="subtaskBatchRowHint">空行会自动跳过；单次最多 50 条</span>
      </div>
      <p class="modal-error" id="subtaskBatchError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnBatchCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnBatchSave">批量创建</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=1.2.32"></script>
  <script src="js/status.js?v=1.2.32"></script>
  <script src="js/utils.js?v=1.2.32"></script>
  <script src="js/api.js?v=1.2.32"></script>
  <script src="js/auth.js?v=1.2.32"></script>
  <script src="js/subtasks.js?v=1.2.32"></script>
  <script src="js/subtask-form.js?v=1.2.32"></script>
  <script src="js/subtask-batch.js?v=1.2.32"></script>
</body>
</html>
