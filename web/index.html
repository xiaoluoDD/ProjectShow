<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>项目管理看板 v1.2.10</title>
  <link rel="stylesheet" href="css/app.css?v=1.2.10" />
</head>
<body>
  <header class="app-header">
    <select class="view-switch" id="viewSwitch" aria-label="界面切换">
      <option value="dashboard">总览看板</option>
      <option value="projects">项目界面</option>
      <option value="accounts" id="optAccounts" hidden>账户管理</option>
    </select>
    <span class="app-version" id="appVersion"></span>
    <button type="button" class="btn" id="btnFilter" hidden>筛选</button>
    <button type="button" class="btn btn-primary" id="btnAddProject" hidden>新增项目</button>
    <button type="button" class="btn" id="btnKiosk">全屏展示</button>
    <button type="button" class="btn btn-primary" id="btnRefresh">刷新</button>
    <button type="button" class="btn" id="btnLogin">登录</button>
    <button type="button" class="btn" id="btnChangePassword" hidden>修改密码</button>
    <button type="button" class="btn" id="btnLogout" hidden>退出</button>
  </header>
  <p class="auth-user-bar" id="authUserBar" hidden></p>

  <button type="button" class="btn btn-kiosk-exit" id="btnKioskExit" hidden title="退出全屏展示">退出全屏</button>

  <main class="app-main">
    <!-- 总览看板 -->
    <section id="dashboardView">
      <div class="dash-toolbar">
        <label for="dashYear">年度</label>
        <select id="dashYear"><option value="">全部</option></select>
      </div>
      <p class="hint-bar" id="dashSummaryBar">加载中…</p>
      <div id="dashboardRoot"></div>
    </section>

    <!-- 项目列表 -->
    <section id="projectsView" hidden>
      <p class="pull-hint" id="projectsHint">只读查看 · 下拉页面可刷新</p>

      <section class="filter-panel" id="filterPanel">
        <label for="filterYear">年度</label>
        <select id="filterYear"><option value="">全部</option></select>

        <label for="filterWorkNo">工番号</label>
        <select id="filterWorkNo"><option value="">全部</option></select>

        <label for="filterManager">项目负责人</label>
        <select id="filterManager"><option value="">全部</option></select>

        <label for="filterStatus">项目状态</label>
        <select id="filterStatus">
          <option value="">全部</option>
          <option value="待启动">待启动</option>
          <option value="进行中">进行中</option>
          <option value="已完结">已完结</option>
        </select>

        <div class="filter-actions">
          <button type="button" class="btn" id="btnClearFilter">清空</button>
          <button type="button" class="btn btn-primary" id="btnApplyFilter">应用</button>
        </div>
      </section>

      <p class="hint-bar" id="summaryBar">加载中…</p>
      <div id="listRoot"></div>
    </section>

    <!-- 账户管理 -->
    <section id="accountsView" hidden>
      <div class="accounts-toolbar">
        <p class="hint-bar" id="accountsSummaryBar">仅管理员可管理账户</p>
        <button type="button" class="btn btn-primary" id="btnAddAccount">新增账户</button>
      </div>
      <div id="accountsRoot"></div>
    </section>
  </main>

  <!-- 登录弹窗 -->
  <div class="modal-mask" id="loginModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <h2 id="loginTitle">登录</h2>
      <label for="loginUsername">账号</label>
      <input id="loginUsername" type="text" autocomplete="username" placeholder="请输入账号" />
      <label for="loginPassword">密码</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码" />
      <p class="modal-error" id="loginError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnLoginCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnLoginSubmit">登录</button>
      </div>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal-mask" id="passwordModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
      <h2 id="passwordTitle">修改密码</h2>
      <p class="modal-hint">无需原密码，直接设置新密码并写入数据库。</p>
      <label for="newPassword">新密码</label>
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="至少 4 位" />
      <label for="newPasswordConfirm">确认新密码</label>
      <input id="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="再输入一次" />
      <p class="modal-error" id="passwordError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnPasswordCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnPasswordSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 账户编辑弹窗 -->
  <div class="modal-mask" id="accountModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h2 id="accountModalTitle">新增账户</h2>
      <input type="hidden" id="accountEditId" value="" />
      <label for="accountUsername">用户名</label>
      <input id="accountUsername" type="text" autocomplete="off" />
      <label for="accountDisplayName">显示名</label>
      <input id="accountDisplayName" type="text" autocomplete="off" />
      <label for="accountRole">权限</label>
      <select id="accountRole">
        <option value="user">普通（可增改项目）</option>
        <option value="admin">管理员（可增改项目 + 管理账户）</option>
      </select>
      <label for="accountPassword" id="accountPasswordLabel">密码</label>
      <input id="accountPassword" type="password" autocomplete="new-password" />
      <p class="modal-hint" id="accountPasswordHint" hidden>留空表示不修改密码</p>
      <p class="modal-error" id="accountError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnAccountCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnAccountSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 新建项目弹窗（字段对齐 Qt 桌面） -->
  <div class="modal-mask" id="projectModal" hidden>
    <div class="modal-card modal-card-form" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
      <h2 id="projectModalTitle">新建项目</h2>
      <div class="modal-scroll">
        <label for="projectYear">年度</label>
        <input id="projectYear" type="text" inputmode="numeric" autocomplete="off" />

        <label for="projectWorkNo">工番号</label>
        <input id="projectWorkNo" type="text" autocomplete="off" />

        <label for="projectName">项目名称</label>
        <input id="projectName" type="text" autocomplete="off" />

        <label for="projectManagerDept">负责人部门</label>
        <select id="projectManagerDept"></select>

        <label for="projectManager">项目负责人</label>
        <select id="projectManager" disabled>
          <option value="">（未指定）</option>
        </select>

        <label for="projectMemberDept">成员部门</label>
        <select id="projectMemberDept"></select>

        <label>项目成员</label>
        <div class="member-checklist" id="projectMemberList" aria-live="polite"></div>
        <p class="modal-hint" id="projectSelectedCount">已选成员：0 人</p>
        <p class="modal-hint" id="projectSelectedSummary">（暂无）</p>

        <label for="projectStartDate">项目启动日期</label>
        <input id="projectStartDate" type="date" />

        <label for="projectEndDate">实际完结日期</label>
        <input id="projectEndDate" type="date" />

        <p class="modal-hint">项目状态由启动日期与实际完结日期自动计算（待启动 / 进行中 / 已完结）。</p>
        <p class="modal-hint">项目任务由子任务组成，创建后可在详情页管理子任务。</p>
        <p class="modal-hint">选负责人：先选部门再选人；选成员：先选部门再勾选，可切换部门继续添加。新建或新增成员后将发送项目加入提醒。</p>
      </div>
      <p class="modal-error" id="projectError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="btnProjectCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnProjectSave">创建</button>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=1.2.10"></script>
  <script src="js/status.js?v=1.2.10"></script>
  <script src="js/utils.js?v=1.2.10"></script>
  <script src="js/api.js?v=1.2.10"></script>
  <script src="js/auth.js?v=1.2.10"></script>
  <script src="js/dashboard.js?v=1.2.10"></script>
  <script src="js/list.js?v=1.2.10"></script>
  <script src="js/project-form.js?v=1.2.10"></script>
  <script src="js/accounts.js?v=1.2.10"></script>
  <script src="js/app.js?v=1.2.10"></script>
</body>
</html>
